<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDF Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }
        canvas {
            width: 100%;
            height: 100%;
        }

        .bar-container {
            width:20rem;
            height:0.5rem;background:#333;border-radius: 1000rem;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        #loading.fade {
            opacity: 0;
            pointer-events: none;
        }
    </style>
<link rel="modulepreload" href="/sdf/sdf_demo-c17c07d2e8e4a9df.js" crossorigin="anonymous" integrity="sha384-SsxoOwZQ8xNLI4b2k1J3vDCDuIEQ8NojGLSB0hGl0CR2xCnZ0HLwHBXiopxlzhBL"><link rel="preload" href="/sdf/sdf_demo-c17c07d2e8e4a9df_bg.wasm" crossorigin="anonymous" integrity="sha384-+vrBakHRAiqliNKNZIvwPuxpP377HcD7KG+TcrLWftPNJs5AO1rdS/cIIOSTNdsc" as="fetch" type="application/wasm"></head>

<body>
  <div id="loading">
    <div class="bar-container">
      <div id="bar" style="height:100%;width:0%;background:#fff;border-radius:3px;transition:width 0.2s"></div>
    </div>
  </div>

<script type="module">
import init, * as bindings from '/sdf/sdf_demo-c17c07d2e8e4a9df.js';

const bar = document.getElementById('bar');
const loading = document.getElementById('loading');

const response = await fetch('/sdf/sdf_demo-c17c07d2e8e4a9df_bg.wasm');
const contentLength = response.headers.get('Content-Length');
const total = contentLength ? parseInt(contentLength) : null;

let received = 0;
const chunks = [];
const reader = response.body.getReader();

while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total) {
        bar.style.width = (received / total * 90) + '%';
    } else {
        bar.style.width = Math.min(90, received / 1e6 * 5) + '%';
    }
}

const wasmBytes = new Uint8Array(received);
let offset = 0;
for (const chunk of chunks) { wasmBytes.set(chunk, offset); offset += chunk.length; }

bar.style.width = '95%';

const wasm = await init({ module_or_path: new Response(wasmBytes, {
    headers: { 'Content-Type': 'application/wasm' }
})});

window.wasmBindings = bindings;
bar.style.width = '100%';

setTimeout(() => { loading.style.opacity = '0'; }, 200);
setTimeout(() => { loading.remove(); }, 700);

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
</script>
</body>

</html>
